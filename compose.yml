services:
  bot:
    build: .
    image: knu-cse-notice-bot
    container_name: knu-cse-notice-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    volumes:
      # SQLite DB를 호스트에 두어 컨테이너를 다시 만들어도 상태가 유지됩니다.
      - ./data:/app/data
    # Long polling과 스케줄러가 정리될 시간을 줍니다.
    stop_grace_period: 30s
