name: KNU CSE Notice Bot

on:
  schedule:
    # 한국시간(KST, UTC+9) 기준 매일 08:00~20:00에 매시간 실행
    - cron: '0 23 * * *'   # KST 08:00
    - cron: '0 0-11 * * *' # KST 09:00~20:00
  workflow_dispatch: # GitHub 웹페이지에서 수동으로 실행할 수 있는 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 워크플로우가 저장소에 코드를 다시 Commit 할 수 있도록 쓰기 권한 부여
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore last notice number
      run: |
        git fetch origin bot-state || true
        if git show origin/bot-state:last_num.txt > /tmp/last_num.txt 2>/dev/null; then
          mv /tmp/last_num.txt last_num.txt
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run crawler script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bot.py

    - name: Save last notice number
      run: |
        mkdir -p /tmp/bot-state
        cp last_num.txt /tmp/bot-state/last_num.txt
        git checkout --orphan bot-state-update
        git rm -rf . || true
        cp /tmp/bot-state/last_num.txt last_num.txt
        git add last_num.txt
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "Update bot state"
        git push --force origin HEAD:bot-state
